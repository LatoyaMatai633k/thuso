version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Data Warehouse
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: thuso_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-thuso_dw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Thuso FastAPI Backend Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: data-platform/docker/Dockerfile.backend
    container_name: thuso_backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=thuso_dw
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - USE_POSTGRES=true
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. Streamlit Analytics Dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: data-platform/docker/Dockerfile.dashboard
    container_name: thuso_dashboard
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=thuso_dw
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - USE_POSTGRES=true
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. Pipeline Runner Service (One-off or Scheduled ETL)
  # ---------------------------------------------------------------------------
  pipeline:
    build:
      context: .
      dockerfile: data-platform/docker/Dockerfile.pipeline
    container_name: thuso_pipeline_runner
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=thuso_dw
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - USE_POSTGRES=true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
